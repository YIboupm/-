<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procurement Hub · My requests</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Procurement<span>Hub</span></div>
  <nav>
    <a href="index.html">New request</a>
    <a href="my-requests.html" class="active">My requests</a>
    <a href="pool.html">Pool &amp; orders</a>
    <a href="buyer.html">Buyer desk</a>
    <a href="audit.html">Audit log</a>
  </nav>
  <div class="who">Signed in as <select id="employee"></select></div>
</header>

<main>
  <section class="panel">
    <h2>My requests <span class="muted small" id="count"></span></h2>
    <div class="body" id="list"><div class="placeholder">Loading…</div></div>
  </section>
</main>

<script src="common.js"></script>
<script>
  const $ = id => document.getElementById(id);

  async function load() {
    const id = $('employee').value;
    history.replaceState(null, '', '?employee=' + encodeURIComponent(id));
    const list = await api('GET', '/api/requests?employeeId=' + encodeURIComponent(id));
    $('count').textContent = `· ${list.length}`;
    $('list').innerHTML = list.length ? myRequestsHtml(list)
      : '<div class="placeholder">No requests yet. Start one under "New request".</div>';
  }

  async function init() {
    const employees = await api('GET', '/api/employees');
    const wanted = new URLSearchParams(location.search).get('employee');
    $('employee').innerHTML = employees
      .map(e => `<option value="${esc(e.id)}" ${e.id === wanted ? 'selected' : ''}>${esc(e.name)} · ${esc(e.jobRole)}, ${esc(e.site)}</option>`).join('');
    $('employee').addEventListener('change', () => load().catch(e => toast('Error: ' + e.message)));
    await load();
  }

  init().catch(e => toast('Error: ' + e.message));
</script>
</body>
</html>
