<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procurement Hub · Buyer desk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Procurement<span>Hub</span></div>
  <nav></nav>
</header>

<main>
  <section class="panel">
    <h2>Buyer desk: accept, collect quotes, award <span class="muted small" id="count"></span></h2>
    <div id="list"></div>
  </section>
</main>

<script src="common.js"></script>
<script>renderNav('buyer.html');</script>
<script>
  let policy = { singleQuoteUpTo: 3000, strategicAbove: 25000 };
  const OWNER = { BUYER: 'Buyer', CATEGORY_MANAGER: 'Category manager (strategic)' };

  async function load() {
    policy = await api('GET', '/api/buyer/requests/policy');
    const requests = await api('GET', '/api/buyer/requests');
    document.getElementById('count').textContent = `· ${requests.length} open`;
    document.getElementById('list').innerHTML = requests.length ? requests.map(card).join('')
      : '<div class="placeholder">Nothing for a buyer. Standard requests are approved and ordered without one.</div>';
    requests.forEach(bind);
  }

  function header(r) {
    const step = r.status === 'BUYER_REVIEW' ? 'Step 1 of 3 · accept' : 'Step 2–3 of 3 · quotes and award';
    return `<div class="muted small">${esc(r.number)} · ${esc(step)} · submitted ${esc((r.submittedAt || '').slice(0, 10))}
        ${r.sourcingOwner ? ` · <span class="tag pref">${esc(OWNER[r.sourcingOwner] || r.sourcingOwner)}</span>` : ''}</div>
      <div class="brief-title">${esc(r.title || r.categoryName)}</div>
      <div class="muted">${esc(r.requester.name)} · ${esc(r.requester.department)}</div>
      ${r.strategic ? `<div class="budget-badge">Strategic review: ${esc(r.strategic.reasons.join('; '))}${r.strategic.note ? ' · decision: ' + esc(r.strategic.note) : ''}</div>` : ''}
      ${approvalsHtml(r)}`;
  }

  function acceptHtml() {
    return `<div class="section-title">Step 1 · Accept</div>
      <div class="muted small">Accept to start collecting quotes (policy 5). If this needs a sourcing strategy rather than quotes, send it to strategic review (policy 7).</div>
      <div class="form-row" style="grid-template-columns: 1fr; margin-top:8px"><input type="text" placeholder="Reason (required for strategic review or reject)" data-f="reason"></div>
      <div class="actions"><button class="primary" data-act="accept">Accept</button>
        <button data-act="strategic">Strategic review</button><button data-act="reject">Reject</button></div>`;
  }

  function sourcingHtml(r) {
    const reqs = requirementsOf(r);
    const quotes = r.quotes || [];
    const rows = quotes.map((q, i) => `<tr><td><input type="radio" name="award-${r.id}" value="${i}" ${i === 0 ? 'checked' : ''}></td>
        <td>${esc(q.supplierName)}</td><td>${esc(q.description || '')}</td><td class="num">${q.quantity}</td>
        <td class="num">${money(q.unitPrice, r.currency)}</td><td class="num">${money(q.total, r.currency)}</td>
        <td class="muted small">${esc(q.reference || '')}</td></tr>`).join('');
    return `<div class="section-title">Step 2 · Quotes <span class="muted small">(policy 5: up to ${money(policy.singleQuoteUpTo)} one quote; above, three; above ${money(policy.strategicAbove)} strategic)</span></div>
      ${quotes.length ? `<table><thead><tr><th></th><th>Supplier</th><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th><th>Reference</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<div class="muted">No quotes yet.</div>'}
      <div class="form-row" style="margin-top:8px">
        <input type="text" placeholder="Supplier" data-q="supplierName">
        <input type="text" placeholder="Item and configuration" data-q="description" value="${esc(r.chosenModel || '')}">
        <input type="text" placeholder="Qty" data-q="quantity" value="${esc((r.attributes && r.attributes.quantity) || 1)}">
        <input type="text" placeholder="Unit price (EUR)" data-q="unitPrice">
      </div>
      <div class="form-row" style="grid-template-columns: 1fr"><input type="text" placeholder="Reference: quote number, link or screenshot name" data-q="reference"></div>
      <div class="actions"><button data-act="add-quote">Add quote</button></div>

      ${quotes.length ? `<div class="section-title">Step 3 · Award the selected quote</div>
        ${r.chosenModel ? `<div class="muted small">The employee chose: ${esc(r.chosenModel)}. If you buy something else, say why.</div>` : ''}
        <div class="form-row" style="grid-template-columns: 1fr"><input type="text" placeholder="Why not the employee's choice? (only if different)" data-f="substitutionReason"></div>
        ${reqs.length ? `<div class="muted small" style="margin:6px 0 4px">Does the item you award meet these?</div><div class="confirm-list">${reqs.map((q, i) => `<label class="opt"><input type="checkbox" data-req="${i}">
          <span>${esc(q.description)} <span class="muted small">${q.strength === 'preference' ? '(nice to have)' : '(must have)'}</span></span></label>`).join('')}</div>` : ''}
        <div class="form-row" style="grid-template-columns: 1fr"><input type="text" placeholder="Fewer quotes than the policy asks? Say why (e.g. only one distributor)" data-f="quoteException"></div>
        <div class="form-row" style="grid-template-columns: 1fr"><input type="text" placeholder="Note to the employee, or the reason if you reject / escalate" data-f="reason"></div>
        <div class="actions"><button class="primary" data-act="award">Award and send to approval</button>
          ${r.sourcingOwner === 'CATEGORY_MANAGER' ? '' : '<button data-act="strategic">Strategic review</button>'}<button data-act="reject">Reject</button></div>`
      : `<div class="form-row" style="grid-template-columns: 1fr"><input type="text" placeholder="Reason (strategic review or reject)" data-f="reason"></div>
        <div class="actions">${r.sourcingOwner === 'CATEGORY_MANAGER' ? '' : '<button data-act="strategic">Strategic review</button>'}<button data-act="reject">Reject</button></div>`}`;
  }

  function card(r) {
    return `<div class="card" id="card-${r.id}">${header(r)}${briefHtml(r)}${r.status === 'BUYER_REVIEW' ? acceptHtml() : sourcingHtml(r)}</div>`;
  }

  function bind(r) {
    const el = document.getElementById('card-' + r.id);
    const val = f => { const x = el.querySelector(`[data-f="${f}"]`); return x ? x.value.trim() : ''; };
    const q = f => el.querySelector(`[data-q="${f}"]`).value.trim();
    const on = (act, fn) => { const b = el.querySelector(`[data-act="${act}"]`); if (b) b.onclick = () => run(fn); };
    on('accept', async () => { await api('POST', `/api/buyer/requests/${r.id}/accept`); toast(`${r.number} accepted`); });
    on('strategic', async () => { await api('POST', `/api/buyer/requests/${r.id}/strategic`, { reason: val('reason') }); toast(`${r.number} sent to strategic review`); });
    on('reject', async () => { await api('POST', `/api/buyer/requests/${r.id}/reject`, { reason: val('reason') }); toast(`${r.number} rejected`); });
    on('add-quote', async () => {
      await api('POST', `/api/buyer/requests/${r.id}/quotes`, { supplierName: q('supplierName'), description: q('description'),
        quantity: parseInt(q('quantity'), 10) || 1, unitPrice: q('unitPrice') || null, reference: q('reference') });
      toast('Quote added');
    });
    on('award', async () => {
      const chosen = el.querySelector(`input[name="award-${r.id}"]:checked`);
      const reqs = requirementsOf(r);
      await api('POST', `/api/buyer/requests/${r.id}/award`, {
        quoteIndex: chosen ? parseInt(chosen.value, 10) : 0, substitutionReason: val('substitutionReason'),
        quoteException: val('quoteException'), note: val('reason'),
        confirmations: reqs.map((x, i) => ({ requirement: x.description, met: el.querySelector(`[data-req="${i}"]`).checked })),
      });
      toast(`${r.number}: awarded, now in approval and the budget check`);
    });
  }

  async function run(fn) {
    try { await fn(); await load(); }
    catch (e) { toast('Error: ' + e.message); }
  }

  load().catch(e => toast('Error: ' + e.message));
</script>
ipt>
</body>
</html>
