<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procurement Hub · New request</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">Procurement<span>Hub</span></div>
  <nav>
    <a href="index.html" class="active">New request</a>
    <a href="pool.html">Pool &amp; orders</a>
    <a href="buyer.html">Buyer desk</a>
    <a href="audit.html">Audit log</a>
  </nav>
  <div class="who">Signed in as <select id="employee"></select></div>
</header>

<main class="intake">
  <section class="panel chat">
    <h2>Assistant</h2>
    <div class="messages" id="messages"></div>
    <div class="questions" id="questions"></div>
    <div class="chips" id="chips"></div>
    <form class="composer" id="composer">
      <input type="text" id="input" placeholder="Describe what you need, in your own words…" autocomplete="off">
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>

  <section class="panel draft">
    <h2>Structured request <span class="status" id="status"></span></h2>
    <div class="body" id="draft">
      <div class="placeholder">As you chat, the assistant fills in a standard request here.<br>
        Green = you said it · Amber = inferred by AI · Grey = taken from your profile.</div>
    </div>
  </section>
</main>

<script src="common.js"></script>
<script>
  const state = { conversationId: null, busy: false, employees: [] };
  const $ = id => document.getElementById(id);

  async function init() {
    state.employees = await api('GET', '/api/employees');
    $('employee').innerHTML = state.employees
      .map(e => `<option value="${esc(e.id)}">${esc(e.name)} · ${esc(e.jobRole)}, ${esc(e.site)}</option>`).join('');
    $('employee').addEventListener('change', newConversation);
    $('composer').addEventListener('submit', e => { e.preventDefault(); send($('input').value); });
    await newConversation();
  }

  async function newConversation() {
    try {
      render(await api('POST', '/api/intake/conversations', { employeeId: $('employee').value }));
      $('input').focus();
    } catch (e) { showError(e); }
  }

  async function send(text) {
    text = text.trim();
    if (!text || state.busy || !state.conversationId) return;
    $('input').value = '';
    setBusy(true);
    appendBubble('user', text);
    const typing = appendBubble('assistant typing', 'Thinking…');
    try {
      render(await api('POST', `/api/intake/conversations/${state.conversationId}/messages`, { text }));
    } catch (e) {
      typing.remove();
      showError(e);
    } finally {
      setBusy(false);
    }
  }

  async function confirmRequest(mode) {
    if (mode === 'special' && !confirm('Send this to a buyer as a special (non-standard) request? A buyer will source and price it individually; it does not go through automatic approval.')) return;
    setBusy(true);
    try { render(await api('POST', `/api/intake/conversations/${state.conversationId}/confirm?mode=${mode}`)); }
    catch (e) { showError(e); }
    finally { setBusy(false); }
  }

  function setBusy(busy) {
    state.busy = busy;
    $('send').disabled = busy;
    document.querySelectorAll('#chips button, #draft button, #questions button').forEach(b => b.disabled = busy);
  }

  function appendBubble(cls, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    $('messages').appendChild(div);
    $('messages').scrollTop = $('messages').scrollHeight;
    return div;
  }

  function showError(e) {
    appendBubble('error', '⚠ ' + e.message);
  }

  // ------------------------------------------------------------ render

  function render(v) {
    state.conversationId = v.id;
    $('messages').innerHTML = '';
    v.turns.forEach(t => appendBubble(t.role, t.text));

    const open = v.status === 'COLLECTING' || v.status === 'AWAITING_CONFIRMATION';
    $('chips').innerHTML = open ? (v.quickReplies || [])
      .map(q => `<button class="chip" type="button">${esc(q)}</button>`).join('') : '';
    $('chips').querySelectorAll('button').forEach(b => b.addEventListener('click', () => send(b.textContent)));
    $('input').disabled = !open;
    $('send').disabled = !open;
    renderQuestions(open ? (v.questions || []) : []);

    $('status').textContent = v.status.replaceAll('_', ' ');
    $('status').className = 'status ' + v.status;
    renderDraft(v, open);
  }

  // ------------------------------------------------------------ multiple-choice questions

  function renderQuestions(questions) {
    state.questions = questions;
    const box = $('questions');
    if (!questions.length) { box.innerHTML = ''; return; }
    const fields = questions.filter(q => q.field !== '_decision');
    const decision = questions.find(q => q.field === '_decision');
    let html = fields.map((q, qi) => `<div class="qcard">
        <div class="qtitle">${esc(q.text)}</div>
        ${q.options.map((o, oi) => `<label class="opt"><input type="radio" name="q${qi}" value="${oi}"> ${esc(o.label)}</label>`).join('')}
        ${q.allowOther ? `<label class="opt other"><input type="radio" name="q${qi}" value="other"> Other:
            <input type="text" class="other-text" data-q="${qi}" placeholder="type your answer"></label>` : ''}
      </div>`).join('');
    if (fields.length) html += '<div class="qactions"><button class="primary" id="sendAnswers" type="button">Send answers</button></div>';
    if (decision) {
      html += `<div class="qcard decision"><div class="qtitle">${esc(decision.text)}</div><div class="qactions">
        ${decision.options.map((o, oi) => `<button type="button" class="${oi === 0 ? 'primary' : ''}" data-d="${oi}">${esc(o.label)}</button>`).join('')}
        </div></div>`;
    }
    box.innerHTML = html;
    box.querySelectorAll('.other-text').forEach(t => t.addEventListener('focus', () => {
      box.querySelector(`input[name="q${t.dataset.q}"][value="other"]`).checked = true;
    }));
    const s = document.getElementById('sendAnswers');
    if (s) s.addEventListener('click', () => sendAnswers(fields));
    box.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
      const o = decision.options[+b.dataset.d];
      postAnswers([{ field: '_decision', value: o.value, label: o.label }]);
    }));
  }

  function sendAnswers(fields) {
    const answers = [];
    fields.forEach((q, qi) => {
      const picked = document.querySelector(`input[name="q${qi}"]:checked`);
      if (!picked) return;
      if (picked.value === 'other') {
        const text = document.querySelector(`.other-text[data-q="${qi}"]`).value.trim();
        if (text) answers.push({ field: q.field, text });
      } else {
        const o = q.options[+picked.value];
        answers.push({ field: q.field, value: o.value, label: o.label });
      }
    });
    if (!answers.length) { toast('Pick an option or type an answer first'); return; }
    postAnswers(answers);
  }

  async function postAnswers(answers) {
    if (state.busy) return;
    setBusy(true);
    const typing = appendBubble('assistant typing', 'Updating your request…');
    try {
      render(await api('POST', `/api/intake/conversations/${state.conversationId}/answers`, { answers }));
    } catch (e) {
      typing.remove();
      showError(e);
    } finally {
      setBusy(false);
    }
  }

  function renderDraft(v, open) {
    if (!v.categoryCode) {
      let html = '<div class="placeholder">As you chat, the assistant fills in a standard request here.<br>'
        + 'Green = you said it · Amber = inferred by AI · Grey = taken from your profile.</div>';
      if (v.status === 'HANDED_OFF') html = handoffBanner(v) + html;
      $('draft').innerHTML = html + newButton();
      bindButtons();
      return;
    }
    let html = '';
    if (v.requestNumber && v.requestStatus === 'BUYER_REVIEW') {
      html += `<div class="banner special">Special request <b>${esc(v.requestNumber)}</b> is with a buyer
               (status <b>BUYER REVIEW</b>). It is sourced individually, outside the automatic pool.
               <a href="buyer.html">Open the buyer desk →</a></div>`;
    } else if (v.requestNumber) {
      html += `<div class="banner">Submitted as <b>${esc(v.requestNumber)}</b> · status <b>${esc(v.requestStatus)}</b>.
               <a href="pool.html">See it in the pool →</a></div>`;
    }
    if (v.status === 'HANDED_OFF') html += handoffBanner(v);

    html += `<div><b>${esc(v.categoryName)}</b> <span class="muted small">(${esc(v.categoryCode)})</span></div>`;

    html += '<div class="section-title">Fields</div><table><tbody>';
    v.fields.forEach(f => {
      const missing = f.required && (f.value === null || f.value === undefined);
      html += `<tr class="${missing ? 'required-missing' : ''}">
        <td style="width:34%">${esc(f.label)}</td>
        <td>${f.value === null || f.value === undefined
          ? `<span class="empty-value">${f.required ? 'needed' : 'optional'}</span>` : esc(display(f.value))}
          ${f.name === 'chargeTo' && v.chargeToCostCenter ? `<span class="muted small"> · ${esc(v.chargeToCostCenter)}</span>` : ''}</td>
        <td style="width:1%">${f.source ? `<span class="src ${f.source}">${SOURCE_LABEL[f.source]}</span>` : ''}</td>
      </tr>`;
    });
    html += '</tbody></table>';

    if (v.lines && v.lines.length) {
      html += '<div class="section-title">Mapped to catalog</div><table><thead><tr>'
        + '<th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th></tr></thead><tbody>';
      v.lines.forEach(l => {
        const specs = l.specs ? Object.entries(l.specs).map(([k, s]) => `<span class="spec">${esc(k)}: ${esc(s)}</span>`).join('') : '';
        html += `<tr><td>${esc(l.name)}<div class="muted small">${esc(l.sku)} · ${esc(l.supplierName)}
                 ${l.note ? ' · ' + esc(l.note) : ''}</div><div class="specs">${specs}</div></td>
                 <td class="num">${l.quantity}</td><td class="num">${money(l.unitPrice, v.currency)}</td>
                 <td class="num">${money(l.lineTotal, v.currency)}</td></tr>`;
      });
      html += `</tbody></table><div class="total"><span>Estimated total</span><span>${money(v.estimatedTotal, v.currency)}</span></div>`;
      if (v.rationale) html += `<div class="why"><b>Why this option:</b> ${esc(v.rationale)}</div>`;
    }

    if (v.checks && v.checks.length) {
      html += '<div class="section-title">Your requirements vs. the catalog</div><table><tbody>';
      v.checks.forEach(k => {
        const label = { MET: 'Met', NOT_MET: 'Not met', UNKNOWN: 'Not in catalog' }[k.status];
        html += `<tr><td>${esc(k.requirement.description)}
                 <div class="muted small">${k.requirement.strength === 'preference' ? 'Preference' : 'Must have'}</div></td>
                 <td class="muted">${k.actual ? 'Catalog: ' + esc(k.actual) : 'Catalog does not specify this'}</td>
                 <td style="width:1%"><span class="check ${k.status}">${label}</span></td></tr>`;
      });
      html += '</tbody></table><div class="muted small" style="margin-top:6px">Checked by the system against catalog data, not by the AI.</div>';
    }

    if (v.specialRequirements && v.specialRequirements.length) {
      html += `<div class="section-title">Must-haves the standard item does not meet</div><div class="special-box">
        <ul>${v.specialRequirements.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
        <div class="small">Either go ahead with the standard item above (automatic approval and pooling),
        or send a special request: a buyer sources and prices it individually.</div></div>`;
    }

    if (v.issues && v.issues.length) {
      html += '<div class="section-title">Checks</div><ul class="issues">'
        + v.issues.map(i => `<li class="${i.severity}">${esc(i.message)}</li>`).join('') + '</ul>';
    }

    const special = v.specialRequirements && v.specialRequirements.length > 0;
    html += '<div class="actions">';
    if (v.status === 'AWAITING_CONFIRMATION') {
      html += `<button class="primary" id="confirm">${special ? 'Use the standard option' : 'Confirm and submit'}</button>`;
    }
    if (open) html += `<button id="special">${special ? 'Send to a buyer as special request' : 'Need something non-standard?'}</button>`;
    html += `<button id="restart">${open ? 'Start over' : 'New request'}</button></div>`;

    html += `<details><summary>Standardised record (JSON)</summary><pre class="json">${esc(JSON.stringify(record(v), null, 2))}</pre></details>`;
    $('draft').innerHTML = html;
    bindButtons();
  }

  function handoffBanner(v) {
    return `<div class="banner handoff">Passed to a buyer: ${esc(v.handoffReason)}</div>`;
  }

  function newButton() {
    return '<div class="actions"><button id="restart">New request</button></div>';
  }

  function bindButtons() {
    const c = document.getElementById('confirm');
    if (c) c.addEventListener('click', () => confirmRequest('standard'));
    const s = document.getElementById('special');
    if (s) s.addEventListener('click', () => confirmRequest('special'));
    const r = document.getElementById('restart');
    if (r) r.addEventListener('click', newConversation);
  }

  function display(value) {
    if (value === true) return 'Yes';
    if (value === false) return 'No';
    return value;
  }

  /** The machine-readable shape that is stored: fields + lines, no chat text. */
  function record(v) {
    const fields = {};
    v.fields.forEach(f => { if (f.value !== null && f.value !== undefined) fields[f.name] = f.value; });
    return {
      category: v.categoryCode,
      requester: v.employeeId,
      fields,
      lines: (v.lines || []).map(l => ({ sku: l.sku, quantity: l.quantity, unitPrice: l.unitPrice, supplierId: l.supplierId, specs: l.specs })),
      specialRequirements: v.specialRequirements,
      estimatedTotal: v.estimatedTotal,
      currency: v.currency,
      missing: v.missingFields,
    };
  }

  init().catch(showError);
</script>
</body>
</html>
